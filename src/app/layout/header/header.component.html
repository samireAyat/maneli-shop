<header class="header-wrapper" role="banner">
    <div class="search-wrapper">

        <div class="mobile-search">

            <form (submit)="$event.preventDefault();search()">

                <label for="site-search">
                    <app-solar-icon [name]="'magnifer'" [size]="20" style="width: 20px; height: 20px;">
                    </app-solar-icon>

                    <span *ngIf="searchControl.value?.length === 0">
                        جستجو
                    </span>
                </label>

                <input id="site-search" name="search" type="text" [formControl]="searchControl" autocomplete="off" />

            </form>

        </div>

    </div>
</header>
