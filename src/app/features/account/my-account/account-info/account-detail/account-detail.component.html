
<div class="account-detail">

  <div class="wrapper">

    <!-- Header -->
    <div class="header">

      <div class="title">
        <span class="title-icon">
          <app-solar-icon
            name="user-id"
            [size]="18">
          </app-solar-icon>
        </span>

        <span>اطلاعات حساب کاربری</span>
      </div>

      <button
        type="button"
        [routerLink]="['/my-account', 'edit-profile']"
        class="edit-btn">

        <app-solar-icon
          name="pen"
          [size]="14">
        </app-solar-icon>

        <span>ویرایش</span>

      </button>

    </div>


    <!-- Content -->
    <div class="content">

      <div class="info-item">

        <span class="label">
          نام
        </span>

        <span class="info">
          {{ userInfo.Name }}
        </span>

      </div>


      <div class="info-item">

        <span class="label">
          نام خانوادگی
        </span>

        <span class="info">
          {{ userInfo.LastName }}
        </span>

      </div>


      <div class="info-item">

        <span class="label">
          شماره تماس
        </span>

        <span class="info ltr">
          {{ userInfo.PhoneNumber }}
        </span>

      </div>


      <div class="info-item">

        <span class="label">
          ایمیل
        </span>

        <span class="info ltr">
          {{ userInfo.Email }}
        </span>

      </div>


      <div class="info-item">

        <span class="label">
          تاریخ تولد
        </span>

        <span class="info">
          {{ userInfo.BirthDate }}
        </span>

      </div>


      <div class="info-item">

        <span class="label">
          کد ملی
        </span>

        <span class="info ltr">
          {{ userInfo.NationalCode }}
        </span>

      </div>

    </div>

  </div>

</div>
