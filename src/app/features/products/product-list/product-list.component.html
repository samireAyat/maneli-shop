    <app-filter (filteredProductsListOutPut)="applyFilter($event)"></app-filter>

    <div class="products-wrapper">

      @if (productsList.length > 0) {

      @for (product of productsList; track product._id) {
      <app-product [product]="product"></app-product>
      }

      } @else {

      <div class="empty-products">

        <div class="empty-products-icon">
          <app-solar-icon [name]="'sad-circle'" [size]="36">
          </app-solar-icon>
        </div>

        <h5>محصولی پیدا نشد</h5>

        <p>
          با فیلترهای انتخاب‌شده محصولی برای نمایش وجود ندارد.
        </p>

        <button type="button" class="clear-empty-filter" (click)="clearFilters()">

          پاک کردن فیلترها

        </button>

      </div>

      }

    </div>

  </div>

</div>
