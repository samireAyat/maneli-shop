<div class="product-list-wrapper">
  <div class="product-list-inner">
    <div class="label">
      <div style="color: var(--title)">
        <app-solar-icon style="width: 20px; height: 20px" [name]="'widget4'" [size]="20"></app-solar-icon>
        <h4>همه محصولات</h4>
      </div>
      <div style="
          display: flex;
          align-items: center;
          color: var(--secondary-500);
          gap: 0.5rem;
        ">
        مشاهده همه
        <app-solar-icon style="width: 16px; height: 16px" [name]="'alt-arrow-left'" [size]="16"></app-solar-icon>
      </div>
    </div>
    <ngx-simplebar style="max-height: 580px">
      <div class="products-wrapper" *ngFor="let product of productsList">

        <div *ngIf="product.Images.length > 0" class="product-image">
          <img [src]="productImageAddress(product.Images[0])" alt="">
        </div>
        <div>{{product.Name}}</div>
      </div>
    </ngx-simplebar>
  </div>
</div>
