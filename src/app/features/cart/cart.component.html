<div class="cart-wrapper">
    <div class="cart-inner">
        <div class="cart-detail">
            <label for="">سبد خرید</label>
            <div class="cart-item">
                <table>
                    <tr>
                        <th width="100px">ردیف</th>
                        <th></th>
                        <th width="300px">عنوان محصول</th>
                        <th width="300px">قیمت</th>
                        <th width="300px">تعداد</th>
                        <th width="300px">قیمت کل</th>
                    </tr>
                    <tr>
                        <td width="100px">1</td>
                        <td>
                            <div class="product-image">
                                <img src="images/IMG_1499-copy-removebg-preview.png" alt="">
                            </div>
                        </td>
                        <td width="300px">
                            <div class="product-title">
                                شومیز لینن
                            </div>
                        </td>
                        <td width="300px">
                            <div class="product-price">{{'1200,000' | persianNumber}}</div>
                        </td>
                        <td width="300px">
                            <div class="product-quantity">
                                <div class="quantity">
                                    <span>-</span>
                                    <span>2</span>
                                    <span>+</span>
                                </div>
                                <div class="trashbin-icon">
                                    <app-solar-icon style="width: 20px; height: 20px;"
                                        [name]="'trash-bin-minimalistic'" [size]="20"></app-solar-icon>
                                </div>
                            </div>
                        </td>
                        <td width="300px">
                            <div class="product-total"></div>
                        </td>
                    </tr>
                    <tr>
                        <td width="100px">2</td>
                        <td>
                            <div class="product-image">
                                <img src="images/IMG_1499-copy-removebg-preview.png" alt="">
                            </div>
                        </td>
                        <td width="300px">
                            <div class="product-title">
                                شومیز لینن
                            </div>
                        </td>
                        <td width="300px">
                            <div class="product-price">{{'1200,000' | persianNumber}}</div>
                        </td>
                        <td width="300px">
                            <div class="product-quantity">
                                <div class="quantity">
                                    <span>-</span>
                                    <span>1</span>
                                    <span>+</span>
                                </div>
                                <div class="trashbin-icon">
                                    <app-solar-icon style="width: 20px; height: 20px;"
                                        [name]="'trash-bin-minimalistic'" [size]="20"></app-solar-icon>
                                </div>
                            </div>
                        </td>
                        <td width="300px">
                            <div class="product-total"></div>
                        </td>
                    </tr>
                </table>






            </div>
        </div>
    </div>
</div>
